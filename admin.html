<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verwaltung · Käthe-Kollwitz-Gymnasium</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="index.html" title="Käthe-Kollwitz-Gymnasium">
    <img class="brand-logo" src="static/logo-kkg.svg" alt="Käthe-Kollwitz-Gymnasium">
    <span class="brand-name">Käthe-Kollwitz-<small>Gymnasium</small></span>
  </a>
  <nav class="topnav">
    <a href="vote.html">Abstimmen</a>
    <a href="dashboard.html">Live-Ergebnisse</a>
    <a href="admin.html">Verwaltung</a>
  </nav>
</header>

<main class="main">
<!-- Login Box -->
<div id="login-section" class="center-col" style="display:none">
  <div class="card login-card">
    <h1>Verwaltung</h1>
    <div class="stack">
      <label class="field">
        <span>Passwort</span>
        <input type="password" id="admin-login-pw" autofocus autocomplete="current-password" required>
      </label>
      <p id="login-error" class="error" style="display:none"></p>
      <button class="btn primary" id="admin-login-btn" type="button">Anmelden</button>
    </div>
  </div>
</div>

<!-- Admin Dashboard -->
<div id="admin-section" class="admin-layout" style="display:none">
  <aside class="admin-side no-print">
    <button class="btn primary wide" id="new-election-btn">Neu anlegen</button>
    <div id="election-list" class="election-list"></div>
    <div class="side-foot no-print">
      <button class="linkish" id="change-pw-btn">Passwort ändern</button>
      <button class="linkish" id="logout-btn">Abmelden</button>
    </div>
  </aside>

  <section class="admin-main">
    <div id="new-panel" class="card hidden">
      <h2>Neue Abstimmung / Umfrage</h2>
      <div class="stack">
        <label class="field"><span>Titel / Frage</span>
          <input id="new-title" type="text" placeholder="z. B. „Projektwoche: Welches Thema?“ oder „Schülerratswahl“">
        </label>
        <label class="field"><span>Beschreibung / Details (optional)</span>
          <textarea id="new-desc" rows="3" placeholder="Worum geht es bei dieser Umfrage?"></textarea>
        </label>
        <label class="field"><span>Erlaubte Auswahl pro Person (z. B. 1 für Einzelauswahl, 2+ für Mehrfachauswahl)</span>
          <input id="new-max" type="number" min="1" max="10" value="1">
        </label>
        <label class="field"><span>Stichtag / Frist (optional)</span>
          <input id="new-deadline" type="datetime-local">
        </label>
        <label class="field" style="flex-direction:row; gap:0.6rem; align-items:center;">
          <input id="new-hide-results" type="checkbox">
          <span>Zwischenstand bis zum Ende verbergen (Blind-Voting)</span>
        </label>
        <button class="btn primary" id="create-election">Anlegen</button>
      </div>
    </div>

    <div id="detail" class="hidden"></div>
    <div id="placeholder" class="placeholder">Abstimmung oder Umfrage auswählen oder neu anlegen.</div>
  </section>
</div>
</main>

<!-- QR Lightbox Modal -->
<div id="qr-lightbox" class="lightbox-overlay no-print" style="display:none">
  <div class="lightbox-backdrop" id="lightbox-backdrop"></div>
  <div class="lightbox-card">
    <button class="lightbox-close" id="lightbox-close-btn" type="button" title="Schließen (Esc)">&times;</button>
    <div id="lightbox-qr-container" class="lightbox-qr"></div>
    <div class="lightbox-code" id="lightbox-code"></div>
    <div class="lightbox-title" id="lightbox-title"></div>
    <div class="lightbox-actions">
      <a class="btn small" id="lightbox-link" target="_blank">Im Browser öffnen ↗</a>
      <button class="btn ghost small" id="lightbox-copy-btn" type="button">Code kopieren</button>
    </div>
  </div>
</div>

<footer class="foot">Käthe-Kollwitz-Gymnasium</footer>

<script src="static/supabase.js"></script>
<script src="static/supabase-config.js"></script>
<script src="static/qrcode.min.js"></script>
<script src="static/admin-supabase.js"></script>
</body>
</html>
