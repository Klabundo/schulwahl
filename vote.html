<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abstimmen · Käthe-Kollwitz-Gymnasium</title>
<script>
(function(){
  const s = localStorage.getItem('theme');
  const d = window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', s || (d ? 'dark' : 'light'));
})();
</script>
<link rel="stylesheet" href="static/style.css">
<style>
  #scanner-modal {
    display: none;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 1rem;
    margin-bottom: 1.2rem;
    text-align: center;
  }
  #reader {
    width: 100%;
    max-width: 320px;
    margin: 0 auto 0.8rem;
    border-radius: var(--radius);
    overflow: hidden;
  }
  .scanner-actions {
    display: flex;
    gap: 0.6rem;
    margin-bottom: 1rem;
  }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="index.html" title="Käthe-Kollwitz-Gymnasium">
    <img class="brand-logo" src="static/logo-kkg.svg" alt="Käthe-Kollwitz-Gymnasium">
    <span class="brand-name">Käthe-Kollwitz-<small>Gymnasium</small></span>
  </a>
  <nav class="topnav">
    <a href="vote.html">Abstimmen</a>
    <a href="dashboard.html">Live-Ergebnisse</a>
    <a href="admin.html">Verwaltung</a>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Darkmode umschalten" title="Farbschema wechseln">
      <svg class="sun-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <svg class="moon-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </nav>
</header>

<main class="main">
<div class="center-col">
  <div class="card vote-card">
    <h1>Abstimmen</h1>

    <div id="scanner-modal">
      <div id="reader"></div>
      <button class="btn ghost small" id="stop-scan-btn" type="button">Kamera schließen</button>
    </div>

    <div class="code-row">
      <label class="field">
        <span>Wahl-Nummer</span>
        <input type="text" id="eid" inputmode="numeric" required>
      </label>
      <label class="field code-field">
        <span>Stimmcode</span>
        <input type="text" id="code" class="code-input" placeholder="ABCD-1234" maxlength="9" required>
      </label>
    </div>

    <div class="scanner-actions">
      <button class="btn" id="load-btn" type="button" style="flex:1">Weiter</button>
      <button class="btn ghost" id="start-scan-btn" type="button" title="QR-Code mit Kamera scannen">📷 QR scannen</button>
    </div>

    <div id="election-box"></div>
    <div id="result-box"></div>
  </div>
</div>
</main>

<footer class="foot">Käthe-Kollwitz-Gymnasium</footer>

<script src="static/supabase.js"></script>
<script src="static/supabase-config.js"></script>
<script src="static/html5-qrcode.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let html5QrCode = null;

function normalizeCode(v) {
  return v.toUpperCase().replace(/[^A-Z0-9-]/g, "").replace(/-{2,}/g, "-");
}

function triggerHaptic(pattern = 50) {
  if (navigator.vibrate) {
    try { navigator.vibrate(pattern); } catch (_) {}
  }
}

function showClosed(el) {
  $("election-box").innerHTML = "";
  $("result-box").innerHTML = `<p class="status-note">„${esc(el.title)}“ ist beendet.</p>`;
}

async function loadElection() {
  const eid = $("eid").value.trim();
  const code = $("code").value.trim();
  const box = $("election-box");
  $("result-box").innerHTML = "";

  if (!/^\d+$/.test(eid)) {
    box.innerHTML = '<p class="error">Bitte Wahl-Nummer eingeben.</p>';
    return;
  }

  const { data: el, error } = await supabase
    .from("elections")
    .select("*, candidates(*)")
    .eq("id", Number(eid))
    .single();

  if (error || !el) {
    box.innerHTML = '<p class="error">Wahl nicht gefunden.</p>';
    return;
  }

  if (el.status === "draft") {
    box.innerHTML = `<p class="status-note">„${esc(el.title)}“ hat noch nicht begonnen.</p>`;
    return;
  }

  if (el.status === "closed" || (el.ends_at && new Date(el.ends_at) <= new Date())) {
    showClosed(el);
    return;
  }

  if (code) {
    const { data: check, error: checkErr } = await supabase.rpc("verify_code", {
      p_election_id: Number(eid),
      p_code: code
    });
    if (!checkErr && check && !check.valid) {
      box.innerHTML = `<p class="error">${esc(check.error || "Ungültiger Code.")}</p>`;
      return;
    }
  }

  if (el.candidates) {
    el.candidates.sort((a, b) => (a.sort - b.sort) || (a.id - b.id));
  }

  renderElection(el);
}

function renderElection(el) {
  const box = $("election-box");
  const multi = el.candidates.length > 1 && el.max_votes > 1;

  box.innerHTML = `
    <div class="election-head">
      <h2>${esc(el.title)}
        ${(el.round || 1) > 1 ? `<span class="pill round">Runde ${el.round}</span>` : ""}
      </h2>
      ${el.description ? `<p class="muted">${esc(el.description)}</p>` : ""}
      ${el.ends_at ? `<p class="muted" id="deadline-note"></p>` : ""}
    </div>
    ${multi ? `<p class="pick-hint">Maximal ${el.max_votes} Stimmen:</p>` : ""}
    <div class="options" id="options">
      ${(el.candidates || []).map(c => `
        <label class="option" data-id="${c.id}">
          <input type="${multi ? "checkbox" : "radio"}" name="candidate" value="${c.id}">
          <span class="option-text">
            <strong>${esc(c.name)}</strong>
            ${c.slogan ? `<small>${esc(c.slogan)}</small>` : ""}
          </span>
        </label>`).join("")}
    </div>
    <button class="btn primary wide" id="submit-vote" type="button">Abstimmen</button>`;

  if (multi) {
    box.querySelectorAll('input[name="candidate"]').forEach(inp => {
      inp.addEventListener("change", () => {
        const picked = box.querySelectorAll('input[name="candidate"]:checked').length;
        if (picked > el.max_votes) { inp.checked = false; }
      });
    });
  }

  $("submit-vote").addEventListener("click", async () => {
    const ids = [...box.querySelectorAll('input[name="candidate"]:checked')].map(i => Number(i.value));
    const code = $("code").value.trim();

    if (!code) {
      $("result-box").innerHTML = '<p class="error">Bitte Stimmcode eingeben.</p>';
      return;
    }

    if (!ids.length) {
      $("result-box").innerHTML = '<p class="error">Bitte mindestens eine Option wählen.</p>';
      return;
    }

    const btn = $("submit-vote");
    btn.disabled = true;
    btn.textContent = "Senden …";

    try {
      const { data: res, error } = await supabase.rpc("cast_vote", {
        p_code: code,
        p_election_id: Number(el.id),
        p_candidate_ids: ids
      });

      btn.disabled = false;
      btn.textContent = "Abstimmen";

      if (error || !res || !res.ok) {
        $("result-box").innerHTML = `<p class="error">${esc((res && res.error) || error?.message || "Fehler beim Abstimmen.")}</p>`;
      } else {
        triggerHaptic([80, 40, 80]);
        $("election-box").innerHTML = "";
        $("result-box").innerHTML = `
          <div class="success">
            <div class="success-mark">✓</div>
            <h2>Stimme gespeichert</h2>
            <p style="margin-top:20px"><a class="btn small" href="dashboard.html?e=${el.id}">Ergebnis anzeigen →</a></p>
          </div>`;
      }
    } catch (err) {
      btn.disabled = false;
      btn.textContent = "Abstimmen";
      $("result-box").innerHTML = '<p class="error">Netzwerkfehler.</p>';
    }
  });

  if (el.ends_at) {
    const end = new Date(el.ends_at).getTime();
    const note = $("deadline-note");
    let timer;
    const tick = () => {
      const ms = end - Date.now();
      if (ms <= 0) {
        clearInterval(timer);
        showClosed(el);
        return;
      }
      note.textContent = `Endet in ${fmtUntil(ms)}.`;
    };
    tick();
    timer = setInterval(tick, 1000);
  }
}

async function startQrScanner() {
  const modal = $("scanner-modal");
  modal.style.display = "block";

  if (!html5QrCode) {
    html5QrCode = new Html5Qrcode("reader");
  }

  const onScanSuccess = (decodedText) => {
    triggerHaptic(50);
    stopQrScanner();

    // Check if URL or plain code
    try {
      if (decodedText.includes("?") && (decodedText.includes("e=") || decodedText.includes("code="))) {
        const u = new URL(decodedText, location.origin);
        const qEid = u.searchParams.get("e");
        const qCode = u.searchParams.get("code");
        if (qEid) $("eid").value = qEid;
        if (qCode) $("code").value = normalizeCode(qCode);
      } else {
        $("code").value = normalizeCode(decodedText);
      }
    } catch (_) {
      $("code").value = normalizeCode(decodedText);
    }

    if ($("eid").value.trim()) {
      loadElection();
    }
  };

  try {
    await html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 220, height: 220 } },
      onScanSuccess,
      () => {}
    );
  } catch (err) {
    alert("Kamerazugriff nicht möglich oder verweigert.");
    stopQrScanner();
  }
}

async function stopQrScanner() {
  if (html5QrCode) {
    try {
      await html5QrCode.stop();
    } catch (_) {}
  }
  $("scanner-modal").style.display = "none";
}

$("code").addEventListener("input", e => { e.target.value = normalizeCode(e.target.value); });

window.addEventListener("DOMContentLoaded", () => {
  const params = new URLSearchParams(location.search);
  const qEid = params.get("e");
  const qCode = params.get("code");

  if (qEid) $("eid").value = qEid;
  if (qCode) $("code").value = normalizeCode(qCode);

  $("load-btn").addEventListener("click", loadElection);
  $("start-scan-btn").addEventListener("click", startQrScanner);
  $("stop-scan-btn").addEventListener("click", stopQrScanner);

  if ($("eid").value.trim()) {
    loadElection();
  }
});
</script>
</body>
</html>
