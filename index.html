<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wahlen &amp; Umfragen · Käthe-Kollwitz-Gymnasium</title>
<script>
(function(){
  const s = localStorage.getItem('theme');
  const d = window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', s || (d ? 'dark' : 'light'));
})();
</script>
<link rel="stylesheet" href="static/style.css?v=3">
</head>
<body>
<header class="top">
  <a class="brand" href="index.html" title="Käthe-Kollwitz-Gymnasium">
    <img class="brand-logo" src="static/logo-kkg.svg" alt="Käthe-Kollwitz-Gymnasium">
    <span class="brand-name">Käthe-Kollwitz-<small>Gymnasium</small></span>
  </a>
  <nav class="topnav">
    <a href="vote.html">Abstimmen</a>
    <a href="dashboard.html">Live-Ergebnisse</a>
    <a href="admin.html">Verwaltung</a>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Darkmode umschalten" title="Farbschema wechseln">
      <svg class="sun-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <svg class="moon-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </nav>
</header>

<main class="main">
<section class="hero" style="padding: 1.5rem 1rem 1rem;">
  <img class="hero-logo" src="static/logo-kkg.svg" alt="Käthe-Kollwitz-Gymnasium" style="height: 80px; margin-bottom: 0.8rem;">
  <h1>Wahlen &amp; Umfragen</h1>
</section>

<section class="cards3" style="margin: 1.5rem 0;">
  <a class="card feature" href="vote.html">
    <h2>Stimme abgeben</h2>
    <span class="card-cta">Öffnen →</span>
  </a>
  <a class="card feature" href="dashboard.html">
    <h2>Live-Ergebnisse</h2>
    <span class="card-cta">Öffnen →</span>
  </a>
  <a class="card feature" href="admin.html">
    <h2>Verwaltung</h2>
    <span class="card-cta">Öffnen →</span>
  </a>
</section>

<section class="section">
  <h3 class="section-title">Aktive Abstimmungen &amp; Umfragen</h3>
  <div id="open-elections"><p class="muted">Keine Abstimmung aktiv.</p></div>
</section>
</main>

<footer class="foot">Käthe-Kollwitz-Gymnasium</footer>

<script src="static/supabase.js"></script>
<script src="static/supabase-config.js?v=3"></script>
<script>
(async () => {
  const box = document.getElementById("open-elections");
  try {
    const { data: list, error } = await supabase
      .from("elections")
      .select("id, title, status, votes(count)")
      .eq("status", "running")
      .order("id", { ascending: false });

    if (error || !list || !list.length) {
      box.innerHTML = '<p class="muted">Keine Wahl aktiv.</p>';
      return;
    }

    box.innerHTML = list.map(e => {
      const voteCount = e.votes ? e.votes[0]?.count || 0 : 0;
      return `
      <div class="election-row">
        <div>
          <strong>${esc(e.title)}</strong>
          <span class="muted"> · ${voteCount} Stimmen</span>
        </div>
        <div class="row-actions">
          <a class="btn small" href="vote.html?e=${e.id}">Abstimmen</a>
          <a class="btn small ghost" href="dashboard.html?e=${e.id}">Ergebnis</a>
        </div>
      </div>`;
    }).join("");
  } catch (err) {
    box.innerHTML = '<p class="muted">Keine Wahl aktiv.</p>';
  }
})();
</script>
</body>
</html>
