<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live-Ergebnisse · Käthe-Kollwitz-Gymnasium</title>
<script>
(function(){
  const s = localStorage.getItem('theme');
  const d = window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', s || (d ? 'dark' : 'light'));
})();
</script>
<link rel="stylesheet" href="static/style.css?v=4">
</head>
<body>
<header class="top">
  <a class="brand" href="index.html" title="Käthe-Kollwitz-Gymnasium">
    <img class="brand-logo" src="static/logo-kkg.svg" alt="Käthe-Kollwitz-Gymnasium">
    <span class="brand-name">Käthe-Kollwitz-<small>Gymnasium</small></span>
  </a>
  <nav class="topnav">
    <a href="vote.html">Abstimmen</a>
    <a href="dashboard.html">Live-Ergebnisse</a>
    <a href="admin.html">Verwaltung</a>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Darkmode umschalten" title="Farbschema wechseln">
      <svg class="sun-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <svg class="moon-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </nav>
</header>

<main class="main">
<div class="center-col dashboard">
  <div class="dash-head">
    <div class="dash-title-row">
      <h1 id="dash-title">Live-Ergebnisse</h1>
      <span id="dash-round" class="pill round" style="display:none">Runde</span>
      <span id="dash-status" class="pill running" style="display:none">läuft</span>
    </div>
    <p class="muted" id="dash-desc"></p>
  </div>

  <div class="dash-stats">
    <div class="stat"><span id="stat-votes">–</span><small>Stimmen gesamt</small></div>
    <div class="stat"><span id="stat-part">–</span><small>Stimmzettel</small></div>
  </div>

  <div id="results-container">
    <div class="card">
      <div id="bars" class="bars"></div>
      <p class="hint" id="dash-hint"></p>
    </div>
  </div>

  <div class="dash-pick">
    <span>Wahl:</span>
    <select id="election-select"><option value="">…</option></select>
  </div>
</div>
</main>

<footer class="foot">Käthe-Kollwitz-Gymnasium</footer>

<script src="static/supabase.js"></script>
<script src="static/supabase-config.js?v=4"></script>
<script>
const params = new URLSearchParams(location.search);
let current = params.get("e") || null;
let realtimeChannel = null;

const statusLabel = { draft: "bereit", running: "aktiv", closed: "beendet" };

async function loadResults(eid, silent = false) {
  try {
    const numEid = Number(eid);
    const { data: el, error: elErr } = await supabase
      .from("elections")
      .select("*, candidates(*)")
      .eq("id", numEid)
      .single();

    if (elErr || !el) throw new Error("Wahl nicht gefunden");

    const { data: votes, error: vErr } = await supabase
      .from("votes")
      .select("candidate_id")
      .eq("election_id", numEid);

    const voteList = votes || [];
    const voteCounts = {};
    for (const v of voteList) {
      voteCounts[v.candidate_id] = (voteCounts[v.candidate_id] || 0) + 1;
    }

    const candidates = (el.candidates || []).map(c => ({
      id: c.id,
      name: c.name,
      slogan: c.slogan,
      votes: voteCounts[c.id] || 0
    }));

    render({
      id: el.id,
      title: el.title,
      description: el.description,
      round: el.round,
      status: el.status,
      hide_results: el.hide_results,
      totals: {
        votes: voteList.length
      },
      candidates: candidates
    });
  } catch (err) {
    if (!silent) {
      document.getElementById("dash-desc").textContent = "Keine Wahl gefunden.";
    }
  }
}

function render(el) {
  document.getElementById("dash-title").textContent = el.title;
  const rp = document.getElementById("dash-round");
  if ((el.round || 1) > 1) {
    rp.textContent = `Runde ${el.round}`;
    rp.style.display = "";
  } else {
    rp.style.display = "none";
  }

  const st = document.getElementById("dash-status");
  st.textContent = statusLabel[el.status] || el.status;
  st.className = "pill " + (el.status === "running" ? "running"
    : el.status === "closed" ? "closed" : "draft");
  st.style.display = "";

  document.getElementById("dash-desc").textContent = el.description || "";
  document.getElementById("stat-votes").textContent = el.totals.votes;
  document.getElementById("stat-part").textContent = el.totals.votes;

  const container = document.getElementById("results-container");

  // Blind-Voting Prüfung: Verdeckter Zwischenstand bei aktiver Wahl
  if (el.hide_results && el.status !== "closed") {
    container.innerHTML = `
      <div class="card" style="text-align:center; padding: 2.2rem 1.4rem;">
        <div style="font-size:2rem; margin-bottom: 0.5rem;">🔒</div>
        <h3>Zwischenstand verdeckt</h3>
        <p class="muted">Ergebnisse werden nach Beendigung der Wahl automatisch aufgedeckt.</p>
        <p class="hint">Live-Beteiligung wird gezählt (${el.totals.votes} Stimmen bisher)</p>
      </div>`;
    return;
  }

  const max = Math.max(1, ...el.candidates.map(c => c.votes));
  const sorted = [...el.candidates].sort((a, b) => b.votes - a.votes);

  const barsHtml = sorted.map((c, i) => {
    const pct = el.totals.votes ? Math.round(100 * c.votes / el.totals.votes) : 0;
    return `
      <div class="bar-row">
        <div class="bar-label">
          ${i === 0 && el.status === "closed" && c.votes > 0 ? '<span class="crown" title="Sieg">★</span> ' : ""}
          <strong>${esc(c.name)}</strong>
          <span class="bar-num">${c.votes} · ${pct} %</span>
        </div>
        <div class="bar-track">
          <div class="bar-fill" style="width:${Math.round(100 * c.votes / max)}%"></div>
        </div>
      </div>`;
  }).join("");

  container.innerHTML = `
    <div class="card">
      <div id="bars" class="bars">${barsHtml}</div>
      <p class="hint" id="dash-hint">${el.status === "running" ? "Live-Aktualisierung aktiv" : "Wahl beendet"}</p>
    </div>`;
}

function subscribeRealtime(eid) {
  if (realtimeChannel) {
    supabase.removeChannel(realtimeChannel);
  }
  const numEid = Number(eid);
  realtimeChannel = supabase
    .channel("dashboard-election-" + numEid)
    .on(
      "postgres_changes",
      { event: "*", schema: "public", table: "votes", filter: `election_id=eq.${numEid}` },
      () => loadResults(numEid, true)
    )
    .on(
      "postgres_changes",
      { event: "*", schema: "public", table: "elections", filter: `id=eq.${numEid}` },
      () => loadResults(numEid, true)
    )
    .subscribe();
}

async function init() {
  const sel = document.getElementById("election-select");
  try {
    const { data: open } = await supabase
      .from("elections")
      .select("id, title, status")
      .order("id", { ascending: true });

    if (open && open.length) {
      sel.innerHTML = open.map(e =>
        `<option value="${e.id}">${esc(e.title)}</option>`
      ).join("");

      if (!current) {
        current = open[0].id.toString();
      }
    }
  } catch (_) {}

  if (current) {
    sel.value = current;
    loadResults(current);
    subscribeRealtime(current);
  }

  sel.addEventListener("change", () => {
    if (sel.value) {
      current = sel.value;
      loadResults(current);
      subscribeRealtime(current);
      history.replaceState(null, "", `dashboard.html?e=${current}`);
    }
  });
}

window.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
