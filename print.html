<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Stimmzettel drucken · Käthe-Kollwitz-Gymnasium</title>
<script>
(function(){
  const s = localStorage.getItem('theme');
  const d = window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', s || (d ? 'dark' : 'light'));
})();
</script>
<style>
  :root {
    color-scheme: light;
    --blue: #265D8E;
    --orange: #FCB11B;
    --bg: #f4f6f9;
    --card: #ffffff;
    --surface: #fbfcfd;
    --ink: #1f2933;
    --muted: #555555;
    --line: #dbe2ea;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --blue: #4ba3e3;
    --bg: #0b0f17;
    --card: #151c28;
    --surface: #1c2637;
    --ink: #f1f5f9;
    --muted: #94a3b8;
    --line: #263347;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --blue: #4ba3e3;
      --bg: #0b0f17;
      --card: #151c28;
      --surface: #1c2637;
      --ink: #f1f5f9;
      --muted: #94a3b8;
      --line: #263347;
    }
  }

  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    color: var(--ink);
    background: var(--bg);
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  .screen-bar {
    position: sticky; top: 0; z-index: 9;
    background: var(--card); border-bottom: 2px solid var(--line);
    padding: 10px 16px; display: flex; gap: 14px; align-items: center;
    flex-wrap: wrap; box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .screen-bar h1 { font-size: 15px; margin: 0 12px 0 0; color: var(--blue); }
  .screen-bar select { padding: 4px 8px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; }
  .screen-bar label { font-size: 14px; display: flex; gap: 6px; align-items: center; color: var(--ink); }
  .screen-bar .spacer { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  .screen-bar a.btn, .screen-bar button.btn {
    font-size: 14px; padding: 6px 14px; border-radius: 8px; cursor: pointer;
    text-decoration: none; display: inline-block; font-weight: 600;
  }
  .screen-bar a.btn { background: var(--surface); color: var(--blue); border: 1.5px solid var(--line); }
  .screen-bar button.btn { background: var(--blue); color: #fff; border: none; }

  /* Theme toggle button */
  .theme-toggle {
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--muted);
    width: 32px;
    height: 32px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border-radius: 999px;
    margin-left: 4px;
    flex: none;
    transition: color .12s ease, border-color .12s ease, background .12s ease;
  }
  .theme-toggle:hover {
    color: var(--ink);
    border-color: var(--blue);
  }
  :root .sun-icon { display: none; }
  :root .moon-icon { display: block; }
  [data-theme="dark"] .sun-icon { display: block; }
  [data-theme="dark"] .moon-icon { display: none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .sun-icon { display: block; }
    :root:not([data-theme="light"]) .moon-icon { display: none; }
  }

  @page { size: A4; margin: 0; }
  @media print {
    .screen-bar, .lightbox-overlay, .theme-toggle { display: none !important; }
    .cell .qr { cursor: default; }
    .cell .qr:hover { transform: none; filter: none; }
    body, .print-page, .cell { background: #fff !important; color: #000 !important; border-color: #333 !important; }
    .print-head h2 { color: #265D8E !important; }
    .print-head { border-bottom-color: #265D8E !important; }
    .print-head h2 small, .print-head .meta, .cell small { color: #555 !important; }
  }

  .print-page { padding: 10mm 9mm; page-break-after: always; background: var(--card); color: var(--ink); }
  .print-page:last-child { page-break-after: auto; }
  .print-head { display: flex; justify-content: space-between; align-items: baseline;
    border-bottom: 3px solid var(--blue); padding-bottom: 6px; margin-bottom: 9px;
    gap: 12px; flex-wrap: wrap; }
  .print-head h2 { font-size: 15pt; margin: 0; color: var(--blue); }
  .print-head h2 small { font-size: 10pt; color: var(--muted); font-weight: 400; }
  .print-head .meta { font-size: 9.5pt; color: var(--muted); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .cell { border: 1.5px solid var(--line); border-radius: 6px; padding: 6px 10px;
    display: flex; gap: 10px; align-items: center; min-height: 40px;
    page-break-inside: avoid; background: var(--surface); color: var(--ink); }
  .cell .code { font-family: "Courier New", monospace; font-size: 14pt;
    font-weight: 700; letter-spacing: 1.5px; color: var(--ink); }
  .cell small { display: block; color: var(--muted); font-size: 8pt; line-height: 1.35; }

  /* Hochauflösende QR-Codes: intern 256x256, skaliert auf 44x44 für gestochen scharfen Druck */
  .cell .qr {
    width: 44px;
    height: 44px;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border-radius: 4px;
    background: #ffffff;
    padding: 2px;
    transition: transform 0.15s ease, filter 0.15s ease;
  }
  .cell .qr:hover {
    transform: scale(1.15);
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.3));
  }
  .cell .qr canvas, .cell .qr img {
    width: 40px !important;
    height: 40px !important;
    image-rendering: -webkit-optimize-contrast;
    image-rendering: crisp-edges;
  }
  .cell.used { opacity: .45; }
  .cell.used .code { text-decoration: line-through; }

  /* Lightbox für vergrößerten QR-Code */
  .lightbox-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  .lightbox-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(15, 23, 42, 0.75);
    backdrop-filter: blur(4px);
  }
  .lightbox-card {
    position: relative;
    z-index: 1;
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 2rem;
    max-width: 90vw;
    width: 380px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.92); }
    to { opacity: 1; transform: scale(1); }
  }
  .lightbox-close {
    position: absolute;
    top: 10px;
    right: 14px;
    background: none;
    border: none;
    font-size: 28px;
    line-height: 1;
    color: var(--muted);
    cursor: pointer;
    padding: 4px;
  }
  .lightbox-close:hover { color: var(--ink); }
  .lightbox-qr {
    width: 280px;
    height: 280px;
    margin: 0.5rem auto 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    padding: 8px;
    border-radius: 8px;
  }
  .lightbox-qr canvas, .lightbox-qr img {
    width: 264px !important;
    height: 264px !important;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    border-radius: 4px;
  }
  .lightbox-code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 1.7rem;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--blue);
    margin-bottom: 0.3rem;
  }
  .lightbox-title {
    color: var(--muted);
    font-size: 0.95rem;
    margin-bottom: 1.2rem;
  }
  .lightbox-actions {
    display: flex;
    justify-content: center;
    gap: 0.8rem;
  }

  #auth-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 99; }
  .auth-card { background: var(--card); color: var(--ink); border: 1px solid var(--line); padding: 24px; border-radius: 12px; width: 340px; }
  .auth-card input { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
</style>
</head>
<body>

<div id="auth-overlay" style="display:none">
  <div class="auth-card">
    <h3>Admin-Passwort</h3>
    <input type="password" id="overlay-pw" style="width:100%; padding:8px; margin: 10px 0;">
    <button class="btn" id="overlay-login-btn">Freischalten</button>
  </div>
</div>

<!-- QR Lightbox Modal -->
<div id="qr-lightbox" class="lightbox-overlay" style="display:none">
  <div class="lightbox-backdrop" id="lightbox-backdrop"></div>
  <div class="lightbox-card">
    <button class="lightbox-close" id="lightbox-close-btn" type="button" title="Schließen (Esc)">&times;</button>
    <div id="lightbox-qr-container" class="lightbox-qr"></div>
    <div class="lightbox-code" id="lightbox-code"></div>
    <div class="lightbox-title" id="lightbox-title"></div>
    <div class="lightbox-actions">
      <a class="btn small" id="lightbox-link" target="_blank">Im Browser öffnen ↗</a>
      <button class="btn ghost small" id="lightbox-copy-btn" type="button">Code kopieren</button>
    </div>
  </div>
</div>

<div class="screen-bar">
  <h1 id="bar-title">Stimmzettel drucken</h1>
  <label><select id="filter-sel">
    <option value="unused">Nur freie (unbenutzte) Zettel</option>
    <option value="all">Alle Zettel</option>
    <option value="used">Nur benutzte Zettel</option>
  </select></label>
  <label><select id="per-sel">
    <option value="25">25 pro Seite</option>
    <option value="50" selected>50 pro Seite</option>
    <option value="100">100 pro Seite</option>
  </select></label>
  <label><input type="checkbox" id="qr-chk" checked> QR-Code auf jedem Zettel</label>
  <span class="spacer">
    <a class="btn" href="admin.html">Zurück zur Verwaltung</a>
    <button class="btn" id="print-btn" type="button">Drucken</button>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Darkmode umschalten" title="Farbschema wechseln">
      <svg class="sun-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <svg class="moon-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </span>
</div>

<div id="pages-container"></div>

<script src="static/supabase.js"></script>
<script src="static/supabase-config.js?v=4"></script>
<script src="static/qrcode.min.js"></script>
<script>
const qs = new URLSearchParams(location.search);
const eid = Number(qs.get("e"));
const qFilter = qs.get("filter");
let pw = sessionStorage.getItem("admin_pw");

if (qFilter && ["all", "unused", "used"].includes(qFilter)) {
  document.getElementById("filter-sel").value = qFilter;
}

function getVoteUrl(code) {
  const origin = location.origin + location.pathname.replace("print.html", "vote.html");
  return `${origin}?e=${eid}&code=${encodeURIComponent(code)}`;
}

let activeLightboxQr = null;
function openLightbox(title, code, url) {
  document.getElementById("lightbox-title").textContent = title;
  document.getElementById("lightbox-code").textContent = code;
  document.getElementById("lightbox-link").href = url;

  const qrBox = document.getElementById("lightbox-qr-container");
  qrBox.innerHTML = "";
  activeLightboxQr = new QRCode(qrBox, {
    text: url,
    width: 280,
    height: 280,
    correctLevel: QRCode.CorrectLevel.H
  });

  const copyBtn = document.getElementById("lightbox-copy-btn");
  copyBtn.textContent = "Code kopieren";
  copyBtn.onclick = () => {
    navigator.clipboard.writeText(code);
    copyBtn.textContent = "Kopiert!";
    setTimeout(() => { copyBtn.textContent = "Code kopieren"; }, 1500);
  };

  document.getElementById("qr-lightbox").style.display = "flex";
}

function closeLightbox() {
  document.getElementById("qr-lightbox").style.display = "none";
}

document.getElementById("lightbox-backdrop").addEventListener("click", closeLightbox);
document.getElementById("lightbox-close-btn").addEventListener("click", closeLightbox);
window.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeLightbox();
});

async function render() {
  if (!eid) {
    document.body.innerHTML = "<p style='padding:2rem'>Keine Wahl angegeben (?e=...).</p>";
    return;
  }

  const { data: el } = await supabase.from("elections").select("*").eq("id", eid).single();
  if (!el) {
    alert("Wahl nicht gefunden.");
    return;
  }
  document.getElementById("bar-title").textContent = `Stimmzettel · ${el.title}`;

  const { data: res } = await supabase.rpc("admin_get_ballots", {
    p_pw: pw,
    p_election_id: eid
  });

  if (!res || !res.ok) {
    sessionStorage.removeItem("admin_pw");
    showAuth();
    return;
  }

  const allBallots = res.ballots || [];
  const filterVal = document.getElementById("filter-sel").value;

  let ballots = allBallots;
  if (filterVal === "unused") {
    ballots = allBallots.filter(b => !b.used_at);
  } else if (filterVal === "used") {
    ballots = allBallots.filter(b => b.used_at);
  }

  const perPage = Number(document.getElementById("per-sel").value);
  const withQr = document.getElementById("qr-chk").checked;
  const container = document.getElementById("pages-container");
  container.innerHTML = "";

  if (!ballots.length) {
    container.innerHTML = `<p style="padding: 2rem; color: var(--muted); font-size: 1.1rem;">Keine Stimmzettel für den Filter „${document.getElementById("filter-sel").selectedOptions[0].text}“ vorhanden (Gesamt: ${allBallots.length}).</p>`;
    return;
  }

  const pages = [];
  for (let i = 0; i < ballots.length; i += perPage) {
    pages.push(ballots.slice(i, i + perPage));
  }

  const filterLabel = filterVal === "unused" ? "nur freie" : filterVal === "used" ? "nur benutzte" : "alle";

  pages.forEach((pageBallots, pIdx) => {
    const pageEl = document.createElement("div");
    pageEl.className = "print-page";

    const headEl = document.createElement("div");
    headEl.className = "print-head";
    headEl.innerHTML = `
      <h2>Käthe-Kollwitz-Gymnasium <small>· ${esc(el.title)}</small></h2>
      <div class="meta">Wahl #${el.id} · ${ballots.length} Zettel (${filterLabel}) · Seite ${pIdx + 1} von ${pages.length} · Zettel ${pIdx * perPage + 1} bis ${Math.min(ballots.length, (pIdx + 1) * perPage)}</div>
    `;
    pageEl.appendChild(headEl);

    const gridEl = document.createElement("div");
    gridEl.className = "grid";

    pageBallots.forEach(b => {
      const cell = document.createElement("div");
      cell.className = `cell ${b.used_at ? "used" : ""}`;

      let qrContainer = null;
      if (withQr) {
        qrContainer = document.createElement("div");
        qrContainer.className = "qr";
        qrContainer.title = "Klicken zum Vergrößern";
        // Hochauflösende 256x256 Pixel-Generierung mit maximaler Fehlerkorrektur (Level H)
        new QRCode(qrContainer, {
          text: getVoteUrl(b.code),
          width: 256,
          height: 256,
          correctLevel: QRCode.CorrectLevel.H
        });
        qrContainer.addEventListener("click", () => {
          openLightbox(el.title, b.code, getVoteUrl(b.code));
        });
        cell.appendChild(qrContainer);
      }

      const info = document.createElement("div");
      info.innerHTML = `
        <span class="code">${esc(b.code)}</span>
        ${b.used_at ? "<small>★ bereits verwendet</small>" : withQr ? "<small>per QR scannen – oder Code eingeben</small>" : `<small>abstimmen bei Wahl #${el.id}</small>`}
      `;
      cell.appendChild(info);
      gridEl.appendChild(cell);
    });

    pageEl.appendChild(gridEl);
    container.appendChild(pageEl);
  });
}

function showAuth() {
  document.getElementById("auth-overlay").style.display = "flex";
  document.getElementById("overlay-login-btn").onclick = async () => {
    const val = document.getElementById("overlay-pw").value;
    const { data } = await supabase.rpc("check_admin_pass", { p_pw: val });
    if (data === true) {
      pw = val;
      sessionStorage.setItem("admin_pw", pw);
      document.getElementById("auth-overlay").style.display = "none";
      render();
    } else {
      alert("Falsches Passwort.");
    }
  };
}

document.getElementById("filter-sel").addEventListener("change", render);
document.getElementById("per-sel").addEventListener("change", render);
document.getElementById("qr-chk").addEventListener("change", render);
document.getElementById("print-btn").addEventListener("click", () => window.print());

if (!pw) {
  showAuth();
} else {
  render();
}
</script>
</body>
</html>
